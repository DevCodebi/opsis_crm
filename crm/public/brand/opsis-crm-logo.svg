<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d9bff"/>
      <stop offset="100%" stop-color="#4f7fe0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Ícone: óculos estilizado, mais geométrico e sólido -->
  <g transform="translate(230,150)">
    <!-- lente esquerda -->
    <rect x="0" y="0" width="90" height="70" rx="18" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <!-- lente direita -->
    <rect x="140" y="0" width="90" height="70" rx="18" fill="none" stroke="url(#accent)" stroke-width="10"/>
    <!-- ponte -->
    <path d="M90 30 Q115 15 140 30" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <!-- haste esquerda -->
    <path d="M0 35 L-30 20" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <!-- haste direita -->
    <path d="M230 35 L260 20" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- divisor -->
  <line x1="580" y1="90" x2="580" y2="270" stroke="#2a3550" stroke-width="2"/>

  <!-- wordmark -->
  <text x="620" y="220" font-family="Helvetica, Arial, sans-serif" font-size="72" fill="#f2f5fa">
    <tspan font-weight="700">Ópsis</tspan><tspan font-weight="300" dx="18">CRM</tspan>
  </text>

  <!-- tagline -->
  <text x="622" y="255" font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="3" fill="#7d8bab">VISÃO CLARA. GESTÃO EFICIENTE</text>
</svg>
